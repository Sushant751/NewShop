services:
  - type: web
    name: newshop-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: JwtSettings__Issuer
        value: BillingApi
      - key: JwtSettings__Audience
        value: BillingSpa
      - key: Redis__ConnectionString
        value: ""
